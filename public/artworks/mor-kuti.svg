<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c15"/>
    </linearGradient>
    <pattern id="pichwai-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#34D399" fill-opacity="0.12" />
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Canvas Background -->
  <rect width="800" height="1000" fill="url(#bg)" />
  <rect width="800" height="1000" fill="url(#pichwai-dots)" />

  <!-- Traditional Ornate Outer Border -->
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="#059669" stroke-width="4" />
  <rect x="36" y="36" width="728" height="928" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="44" y="44" width="712" height="912" fill="none" stroke="#059669" stroke-width="1" />

  <!-- Four Ornate Corner Motifs -->
  <g fill="#059669">
    <path d="M 44 44 L 84 44 L 84 52 L 52 52 L 52 84 L 44 84 Z" />
    <circle cx="64" cy="64" r="5" fill="#34D399" />
    <path d="M 756 44 L 716 44 L 716 52 L 748 52 L 748 84 L 756 84 Z" />
    <circle cx="736" cy="64" r="5" fill="#34D399" />
    <path d="M 44 956 L 84 956 L 84 948 L 52 948 L 52 916 L 44 916 Z" />
    <circle cx="64" cy="936" r="5" fill="#34D399" />
    <path d="M 756 956 L 716 956 L 716 948 L 748 948 L 748 916 L 756 916 Z" />
    <circle cx="736" cy="936" r="5" fill="#34D399" />
  </g>

  <!-- Inner Artwork Area -->
  <g id="artwork" transform="translate(60, 60)">
    
      <rect x="0" y="0" width="680" height="820" fill="#022C22" rx="4" />
      <!-- Dark Monsoon Clouds (Megh) with Golden Lightning -->
      <path d="M 40 100 Q 140 40 240 90 Q 340 30 440 90 Q 540 40 640 100 L 640 0 L 40 0 Z" fill="#1E293B" stroke="#059669" stroke-width="2"/>
      <path d="M 280 90 L 300 130 L 290 140 L 320 180" stroke="#FBBF24" stroke-width="3" fill="none"/>
      <!-- Two Majestic Dancing Peacocks -->
      <!-- Left Peacock -->
      <g transform="translate(220, 480)">
        <!-- Fan of Tail Feathers -->
        <path d="M 0 0 C -120 -80 -180 -200 0 -240 C 180 -200 120 -80 0 0 Z" fill="#047857" stroke="#10B981" stroke-width="2"/>
        <!-- Eyespots on feathers -->
        
          <ellipse cx="-60" cy="-180" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="-60" cy="-180" r="6" fill="#059669"/>
        
          <ellipse cx="0" cy="-210" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="0" cy="-210" r="6" fill="#059669"/>
        
          <ellipse cx="60" cy="-180" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="60" cy="-180" r="6" fill="#059669"/>
        
          <ellipse cx="-80" cy="-120" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="-80" cy="-120" r="6" fill="#059669"/>
        
          <ellipse cx="0" cy="-140" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="0" cy="-140" r="6" fill="#059669"/>
        
          <ellipse cx="80" cy="-120" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="80" cy="-120" r="6" fill="#059669"/>
        
        <!-- Peacock Body & Neck -->
        <path d="M 0 -80 Q -30 -140 -15 -180 Q 0 -170 10 -140 Z" fill="#1E40AF" stroke="#60A5FA" stroke-width="2"/>
        <!-- Crest -->
        <circle cx="-15" cy="-195" r="5" fill="#FBBF24"/>
      </g>
      <!-- Right Peacock -->
      <g transform="translate(460, 480) scale(-1, 1)">
        <path d="M 0 0 C -120 -80 -180 -200 0 -240 C 180 -200 120 -80 0 0 Z" fill="#047857" stroke="#10B981" stroke-width="2"/>
        
          <ellipse cx="-60" cy="-180" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="-60" cy="-180" r="6" fill="#059669"/>
        
          <ellipse cx="0" cy="-210" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="0" cy="-210" r="6" fill="#059669"/>
        
          <ellipse cx="60" cy="-180" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="60" cy="-180" r="6" fill="#059669"/>
        
          <ellipse cx="-80" cy="-120" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="-80" cy="-120" r="6" fill="#059669"/>
        
          <ellipse cx="0" cy="-140" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="0" cy="-140" r="6" fill="#059669"/>
        
          <ellipse cx="80" cy="-120" rx="16" ry="22" fill="#1D4ED8" stroke="#F59E0B" stroke-width="2"/>
          <circle cx="80" cy="-120" r="6" fill="#059669"/>
        
        <path d="M 0 -80 Q -30 -140 -15 -180 Q 0 -170 10 -140 Z" fill="#1E40AF" stroke="#60A5FA" stroke-width="2"/>
        <circle cx="-15" cy="-195" r="5" fill="#FBBF24"/>
      </g>
    
  </g>

  <!-- Caption Plate at Bottom -->
  <g transform="translate(400, 915)" text-anchor="middle">
    <rect x="-240" y="-28" width="480" height="46" rx="2" fill="#1C1917" fill-opacity="0.88" stroke="#059669" stroke-width="1" filter="url(#shadow)" />
    <text y="-6" fill="#FBF8F3" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" letter-spacing="1.5">Mor Kuti Peacock Pichwai</text>
    <text y="12" fill="#34D399" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="2" text-transform="uppercase">Barsana Monsoon Dance of Devotion</text>
  </g>
</svg>